<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ Bot — Internship Assistant</title>
<style>
  :root{
    --ink:#1c1e2b;
    --paper:#eef0f7;
    --card:#ffffff;
    --line:#dbdfec;
    --accent:#3d4fd6;
    --accent-dark:#2c3aa8;
    --bot-bubble:#ffffff;
    --user-bubble:#3d4fd6;
    --muted:#767a94;
    --green:#2f8f5b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:0;
  }
  .app-shell{
    width:100%;
    max-width:520px;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
  }
  header{
    background:var(--accent);
    color:#fff;
    padding:18px 20px;
    display:flex;
    align-items:center;
    gap:12px;
    position:sticky;
    top:0;
    z-index:10;
  }
  .bot-avatar{
    width:38px;height:38px;border-radius:50%;
    background:rgba(255,255,255,0.2);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;
  }
  header .title{ font-weight:600; font-size:16px; }
  header .status{ font-size:12px; opacity:0.85; display:flex; align-items:center; gap:5px; }
  header .dot{ width:7px;height:7px;border-radius:50%;background:#5be08a; }

  .chat-area{
    flex:1;
    padding:18px 16px 8px;
    display:flex;
    flex-direction:column;
    gap:12px;
    overflow-y:auto;
  }
  .msg-row{ display:flex; }
  .msg-row.user{ justify-content:flex-end; }
  .msg-row.bot{ justify-content:flex-start; }
  .bubble{
    max-width:78%;
    padding:11px 15px;
    border-radius:16px;
    font-size:14.5px;
    line-height:1.5;
  }
  .bot .bubble{
    background:var(--bot-bubble);
    border:1px solid var(--line);
    border-bottom-left-radius:4px;
  }
  .user .bubble{
    background:var(--user-bubble);
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .match-tag{
    font-size:11px;
    color:var(--muted);
    margin-top:6px;
    padding-top:6px;
    border-top:1px dashed var(--line);
  }
  .match-tag.high{ color:var(--green); }

  .suggestions{
    padding:0 16px 10px;
    display:flex;
    gap:8px;
    overflow-x:auto;
  }
  .chip{
    flex-shrink:0;
    background:var(--card);
    border:1px solid var(--line);
    color:var(--accent);
    padding:8px 14px;
    border-radius:20px;
    font-size:12.5px;
    cursor:pointer;
    white-space:nowrap;
  }
  .chip:hover{ background:var(--accent); color:#fff; border-color:var(--accent); }

  .input-bar{
    display:flex;
    gap:10px;
    padding:12px 16px 20px;
    background:var(--paper);
    border-top:1px solid var(--line);
  }
  .input-bar input{
    flex:1;
    padding:12px 16px;
    border-radius:24px;
    border:1px solid var(--line);
    font-size:14.5px;
    font-family:inherit;
    background:var(--card);
    color:var(--ink);
  }
  .input-bar input:focus{ outline:none; border-color:var(--accent); }
  .send-btn{
    width:44px;height:44px;
    border-radius:50%;
    background:var(--accent);
    color:#fff;
    border:none;
    font-size:16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .send-btn:hover{ background:var(--accent-dark); }
  .send-btn:disabled{ opacity:0.4; cursor:not-allowed; }

  .typing{
    display:flex;
    gap:4px;
    padding:4px 2px;
  }
  .typing span{
    width:6px;height:6px;border-radius:50%;
    background:var(--muted);
    animation:blink 1.2s infinite;
  }
  .typing span:nth-child(2){ animation-delay:0.2s; }
  .typing span:nth-child(3){ animation-delay:0.4s; }
  @keyframes blink{ 0%,80%,100%{opacity:0.2;} 40%{opacity:1;} }
</style>
</head>
<body>

<div class="app-shell">
  <header>
    <div class="bot-avatar">&#129302;</div>
    <div>
      <div class="title">Internship FAQ Bot</div>
      <div class="status"><span class="dot"></span> Online — ask me anything about the internship</div>
    </div>
  </header>

  <div class="chat-area" id="chatArea"></div>

  <div class="suggestions" id="suggestions"></div>

  <div class="input-bar">
    <input type="text" id="userInput" placeholder="Type your question..." autocomplete="off">
    <button class="send-btn" id="sendBtn">&#10148;</button>
  </div>
</div>

<script>
  /* ---------- FAQ DATA ---------- */
  const faqs = [
    { q: "How do I complete my internship?", a: "You need to complete any 2 or 3 out of the 4 tasks listed in your domain's task document. Submitting only one task will be considered incomplete." },
    { q: "What certificate will I receive?", a: "You'll receive a QR-verified Completion Certificate along with a Unique ID Certificate, once you've completed the minimum required tasks." },
    { q: "How do I submit my project?", a: "Upload your source code to a GitHub repository named CodeAlpha_ProjectName, then submit your completed task using the official Submission Form shared in your WhatsApp group." },
    { q: "Do I need to post on LinkedIn?", a: "Yes, you should share your internship status on LinkedIn and tag @CodeAlpha, and also post a short video explanation of your project along with the GitHub repo link." },
    { q: "What is the GitHub repo naming format?", a: "Name your repository exactly as CodeAlpha_ProjectName, replacing 'ProjectName' with your actual project's name." },
    { q: "How many tasks do I need to complete?", a: "You must complete a minimum of two or three tasks from your domain's task list to be eligible for the completion certificate." },
    { q: "Will I get a letter of recommendation?", a: "Yes, a Letter of Recommendation is provided based on your performance during the internship." },
    { q: "How can I contact CodeAlpha for support?", a: "You can reach out via WhatsApp at +91 9336576683, or email services@codealpha.tech / services.codealpha@gmail.com." },
    { q: "Where do I get the submission form?", a: "The submission form is shared in your respective WhatsApp group. Follow the instructions in the form carefully so your submission is accepted." },
    { q: "What happens if I submit only one task?", a: "Submitting only one task will be considered incomplete, and certificates will not be issued in that case." }
  ];

  /* ---------- NLP-style preprocessing ---------- */
  const stopwords = new Set(['a','an','the','is','are','do','does','i','my','me','to','of','in','on','for','and','or','how','what','will','be','can','you','your','it','this','that','with','need']);

  function tokenize(text){
    return text
      .toLowerCase()
      .replace(/[^a-z0-9\s]/g, ' ')
      .split(/\s+/)
      .filter(function(t){ return t.length > 0 && !stopwords.has(t); });
  }

  function termFreq(tokens){
    const freq = {};
    tokens.forEach(function(t){ freq[t] = (freq[t] || 0) + 1; });
    return freq;
  }

  function cosineSimilarity(freqA, freqB){
    const allTerms = new Set(Object.keys(freqA).concat(Object.keys(freqB)));
    let dot = 0, magA = 0, magB = 0;
    allTerms.forEach(function(term){
      const a = freqA[term] || 0;
      const b = freqB[term] || 0;
      dot += a * b;
      magA += a * a;
      magB += b * b;
    });
    if(magA === 0 || magB === 0) return 0;
    return dot / (Math.sqrt(magA) * Math.sqrt(magB));
  }

  // Preprocess all FAQ questions once
  const faqVectors = faqs.map(function(f){
    return { faq: f, freq: termFreq(tokenize(f.q)) };
  });

  function findBestMatch(userText){
    const userFreq = termFreq(tokenize(userText));
    let best = null;
    let bestScore = 0;
    faqVectors.forEach(function(entry){
      const score = cosineSimilarity(userFreq, entry.freq);
      if(score > bestScore){
        bestScore = score;
        best = entry.faq;
      }
    });
    return { match: best, score: bestScore };
  }

  /* ---------- Chat UI logic ---------- */
  const chatArea = document.getElementById('chatArea');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const suggestionsWrap = document.getElementById('suggestions');

  function addMessage(text, sender, matchInfo){
    const row = document.createElement('div');
    row.className = 'msg-row ' + sender;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    if(matchInfo){
      const tag = document.createElement('div');
      tag.className = 'match-tag' + (matchInfo.score > 0.5 ? ' high' : '');
      tag.textContent = 'Matched FAQ (similarity: ' + Math.round(matchInfo.score * 100) + '%)';
      bubble.appendChild(tag);
    }
    row.appendChild(bubble);
    chatArea.appendChild(row);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function showTyping(){
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.id = 'typingRow';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    row.appendChild(bubble);
    chatArea.appendChild(row);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function removeTyping(){
    const row = document.getElementById('typingRow');
    if(row) row.remove();
  }

  function handleUserMessage(text){
    if(!text.trim()) return;
    addMessage(text, 'user');
    userInput.value = '';
    sendBtn.disabled = true;
    showTyping();

    setTimeout(function(){
      removeTyping();
      const result = findBestMatch(text);
      if(result.match && result.score > 0.15){
        addMessage(result.match.a, 'bot', result);
      } else {
        addMessage("I'm not sure about that one. Try asking about certificates, submission, GitHub, LinkedIn, or task requirements.", 'bot');
      }
      sendBtn.disabled = false;
    }, 700);
  }

  sendBtn.addEventListener('click', function(){ handleUserMessage(userInput.value); });
  userInput.addEventListener('keypress', function(e){
    if(e.key === 'Enter') handleUserMessage(userInput.value);
  });

  function renderSuggestions(){
    suggestionsWrap.innerHTML = '';
    const samples = [
      "How do I submit my project?",
      "What certificate will I get?",
      "How many tasks do I need?",
      "GitHub repo name format?"
    ];
    samples.forEach(function(s){
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.textContent = s;
      chip.addEventListener('click', function(){ handleUserMessage(s); });
      suggestionsWrap.appendChild(chip);
    });
  }

  // Initial greeting
  addMessage("Hi! I'm the Internship FAQ Bot. Ask me anything about tasks, certificates, submission, or GitHub — I'll match your question to the closest FAQ using text similarity.", 'bot');
  renderSuggestions();
</script>

</body>
</html>
